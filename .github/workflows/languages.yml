name: Generate GitHub Profile Stats

on:
schedule:
# Runs every 12 hours
- cron: "0 */12 * * *"

workflow_dispatch:

push:
branches:
- main

jobs:
generate:
name: Update GitHub Stats Card
runs-on: ubuntu-latest
timeout-minutes: 5

```
permissions:
  contents: write

steps:
  - name: Generate stats card
    uses: readme-tools/github-readme-stats-action@v1
    with:
      card: stats
      options: username=vikshithkumar&hide_title=false&hide_rank=false&show_icons=true&include_all_commits=true&count_private=true&disable_animations=false&theme=dracula&locale=en&hide_border=false
      path: dist/stats.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Deploy stats card
    uses: crazy-max/ghaction-github-pages@v3.1.0
    with:
      target_branch: stats-output
      build_dir: dist
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
