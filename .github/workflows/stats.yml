name: Update GitHub Profile Stats

on:
schedule:
# Run every 12 hours
- cron: "0 */12 * * *"

workflow_dispatch:

push:
branches:
- main

jobs:
generate-stats:
name: Generate and Deploy Stats Card
runs-on: ubuntu-latest
timeout-minutes: 5

```
permissions:
  contents: write

steps:
  - name: Generate GitHub Stats Card
    uses: readme-tools/github-readme-stats-action@v1
    with:
      card: stats
      options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&theme=dracula&hide_border=false&hide_title=false&hide_rank=false&disable_animations=false&locale=en
      path: dist/stats.svg
      token: ${{ secrets.GITHUB_TOKEN }}

  - name: Publish Stats Card
    uses: crazy-max/ghaction-github-pages@v3.1.0
    with:
      target_branch: stats-output
      build_dir: dist
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
